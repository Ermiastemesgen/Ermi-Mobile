<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Products API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🧪 Products API Test</h1>
    
    <button onclick="testProductsAPI()">Test Products API</button>
    <button onclick="testDirectAPI()">Test Direct API Call</button>
    <button onclick="clearResults()">Clear Results</button>
    
    <div id="results"></div>

    <script>
        async function testProductsAPI() {
            const results = document.getElementById('results');
            results.innerHTML += '<div class="test-result info">🔄 Testing Products API...</div>';
            
            try {
                const response = await fetch('/api/products');
                const status = response.status;
                const data = await response.json();
                
                results.innerHTML += `<div class="test-result success">
                    ✅ API Response Status: ${status}<br>
                    📦 Response Type: ${typeof data}<br>
                    📋 Data Keys: ${Object.keys(data).join(', ')}<br>
                    📊 Products Count: ${data.products ? data.products.length : 'N/A'}
                </div>`;
                
                results.innerHTML += `<div class="test-result info">
                    <strong>Raw Response:</strong>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </div>`;
                
                if (data.products && Array.isArray(data.products)) {
                    results.innerHTML += `<div class="test-result success">
                        ✅ Products array found with ${data.products.length} items
                    </div>`;
                } else {
                    results.innerHTML += `<div class="test-result error">
                        ❌ Products array not found or invalid format
                    </div>`;
                }
                
            } catch (error) {
                results.innerHTML += `<div class="test-result error">
                    ❌ Error: ${error.message}
                </div>`;
            }
        }
        
        async function testDirectAPI() {
            const results = document.getElementById('results');
            results.innerHTML += '<div class="test-result info">🔄 Testing Direct API Call...</div>';
            
            try {
                const response = await fetch('/api/products');
                const text = await response.text();
                
                results.innerHTML += `<div class="test-result info">
                    <strong>Raw Response Text:</strong>
                    <pre>${text}</pre>
                </div>`;
                
                try {
                    const parsed = JSON.parse(text);
                    results.innerHTML += `<div class="test-result success">
                        ✅ JSON is valid
                    </div>`;
                } catch (parseError) {
                    results.innerHTML += `<div class="test-result error">
                        ❌ JSON Parse Error: ${parseError.message}
                    </div>`;
                }
                
            } catch (error) {
                results.innerHTML += `<div class="test-result error">
                    ❌ Network Error: ${error.message}
                </div>`;
            }
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        // Auto-test on page load
        window.onload = () => {
            testProductsAPI();
        };
    </script>
</body>
</html>
