services:
  - type: web
    name: ermi-mobile
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    branch: main
    repo: https://github.com/YOUR_USERNAME/YOUR_REPO_NAME
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: true
    healthCheckPath: /
    disk:
      name: ermi-mobile-disk
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
